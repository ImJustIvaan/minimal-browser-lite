<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Minimal Browser Lite</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="chrome">
    <div id="tabstrip">
      <div id="tabs"></div>
      <button id="new-tab" title="New Tab">+</button>
    </div>

    <div id="toolbar">
      <button id="back" title="Back">&#8592;</button>
      <button id="forward" title="Forward">&#8594;</button>
      <button id="reload" title="Reload">&#8635;</button>

      <div id="address-wrap">
        <span id="address-icon">&#128274;</span>
        <input id="address" type="text" placeholder="Search or enter address" />
        <button id="star-btn" title="Bookmark this page">&#9734;</button>
      </div>

      <button id="history-btn" title="History">&#8987;</button>
      <button id="bookmarks-btn" title="Bookmarks">&#9733;</button>
      <div id="avatar">M</div>
    </div>
  </div>

  <div id="panel-overlay" class="hidden"></div>
  <div id="panel" class="hidden">
    <div id="panel-header">
      <span id="panel-title"></span>
      <button id="panel-close">&times;</button>
    </div>
    <div id="panel-body"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
